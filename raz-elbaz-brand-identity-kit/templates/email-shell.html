<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>RowdyQL</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@800;900&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Math&display=swap" rel="stylesheet">
<!--
  RowdyQL email shell (identity-kit, filled 2026-10-05 from kit.json). One render path for every message:
  the chrome stays, the BODY_HTML slot changes. Light only. Placeholders (no braces in this comment on purpose):
  LANG (he or en), DIR (rtl or ltr), ALIGN (right for Hebrew, left for English), PREHEADER, HEADER_IMAGE_URL (hosted PNG of logo/rowdyql-logo-light.svg,
  480px wide, see assets/ASSETS.md), BODY_HTML, FOOTER_LINE. Sender variables such as the Supabase ConfirmationURL
  stay exactly as written.
  Tokens used (literal, from kit.json): canvas #F7F2EC, card #FDFBF8, border 1px #DDD7CF, text #373C44,
  muted #5F6670, link and CTA #20778A, CTA text #FDFBF8, radius 0, shadow none.
  Body blocks to paste into BODY_HTML (inline styles only):
    h1:   <h1 style="margin:0 0 12px;font-family:'Rubik',Arial,Helvetica,sans-serif;font-weight:800;font-size:24px;line-height:1.3;color:#373C44;">...</h1>
    p:    <p style="margin:0 0 14px;font-size:16px;line-height:1.65;color:#373C44;">...</p>
    meta: <p style="margin:0 0 14px;font-size:14px;line-height:1.6;color:#5F6670;">...</p>
    kicker (Latin only gets letter-spacing): <p style="margin:0 0 6px;font-size:13px;font-weight:700;color:#5F6670;">...</p>
    box:  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F7F2EC;border:1px solid #DDD7CF;"><tr><td style="padding:16px 20px;">...</td></tr></table>
    CTA:  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 18px;"><tr><td bgcolor="#20778A" style="background:#20778A;"><a href="URL" style="display:inline-block;padding:14px 28px;font-family:'Heebo',Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;color:#FDFBF8;text-decoration:none;">LABEL</a></td></tr></table>
    note (only to mark something): <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FFF1D6;border:1px solid #DDD7CF;"><tr><td style="padding:14px 18px;font-size:15px;line-height:1.6;color:#373C44;"><b style="color:#966212;">!</b> ...</td></tr></table>
    LTR island inside Hebrew: <span dir="ltr">...</span>
-->
<style>
  body { margin:0; padding:0; background:#F7F2EC; -webkit-text-size-adjust:100%; }
  table { border-collapse:collapse; }
  img { border:0; line-height:100%; outline:none; text-decoration:none; }
  a { color:#20778A; }
  @media (max-width:640px){ .container{ width:100% !important; } .pad{ padding-left:20px !important; padding-right:20px !important; } }
</style>
</head>
<body style="margin:0; padding:0; background:#F7F2EC;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">{{PREHEADER}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F7F2EC" style="background:#F7F2EC;">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background:#FDFBF8; border:1px solid #DDD7CF; border-radius:0; box-shadow:none;">

          <!-- HEADER: the light logo (hosted PNG), on surface, a hairline under it -->
          <tr>
            <td class="pad" dir="{{DIR}}" style="padding:24px 32px 20px 32px; border-bottom:1px solid #DDD7CF; text-align:{{ALIGN}};">
              <a href="https://rowdyql.com" style="text-decoration:none;"><img src="{{HEADER_IMAGE_URL}}" width="240" alt="RowdyQL" style="display:inline-block; width:240px; max-width:100%; height:auto; border:0; color:#373C44; font-family:'Rubik',Arial,Helvetica,sans-serif; font-weight:800; font-size:24px;"></a>
            </td>
          </tr>

          <!-- BODY (single slot: inline-styled <h1>, <p> and <table> blocks only) -->
          <tr>
            <td class="pad" dir="{{DIR}}" style="padding:32px 32px 24px 32px; font-family:'Heebo','Rubik',Arial,Helvetica,sans-serif; color:#373C44; font-size:16px; line-height:1.65; text-align:{{ALIGN}};">
{{BODY_HTML}}
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td class="pad" dir="{{DIR}}" bgcolor="#F7F2EC" style="background:#F7F2EC; border-top:1px solid #DDD7CF; padding:18px 32px; text-align:{{ALIGN}};">
              <div style="font-family:'Heebo',Arial,Helvetica,sans-serif; font-size:13px; line-height:1.6; color:#5F6670;">{{FOOTER_LINE}}</div>
              <div dir="ltr" style="font-family:'Heebo',Arial,Helvetica,sans-serif; font-size:13px; line-height:1.6; color:#5F6670;">RowdyQL · <a href="https://rowdyql.com" style="color:#20778A; text-decoration:none;">rowdyql.com</a></div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
