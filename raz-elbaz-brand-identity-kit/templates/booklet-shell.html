<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RowdyQL - {{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@800;900&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Math&display=swap" rel="stylesheet">
<!--
  RowdyQL booklet shell (identity-kit, filled 2026-10-05). Screen: a scrolling reading booklet, light or dark by the
  reader's system setting. Print: A4 portrait, always light, white paper, no glow.
  Slots: LANG (he or en), DIR (rtl or ltr), TITLE, KICKER (a short Latin eyebrow, e.g. "booklet 02 · RowdyQL"),
  DECK (one line under the title), AUTHOR, DATE, COVER_PATH (assets/cover-booklet.png, or replace the whole <img> with
  the inline schema map from motifs/schema-map.svg), COVER_ALT, ARTICLE_HTML, TAKEAWAYS_TITLE, TAKEAWAYS_HTML, FOOTER_LINE.
  Pre-filled: the tokens (design-tokens.css), the logo (logo/rowdyql-logo-light.svg with fills var(--ink) and
  var(--neon-l): the light logo in light, the dark flat logo in dark), the divider (motifs/data-line.svg).
  ARTICLE_HTML building blocks:
    <p class="lead"><span class="lead-in">first words</span> rest of the paragraph</p>
    <h2>Section</h2>  <h3>Sub-section</h3>  <p>Body</p>
    <div class="callout"><p class="callout__title">Title</p><p>Text</p></div>          (rule card, neon bar)
    <blockquote class="quote"><p>Quote</p><cite>Who</cite></blockquote>                    (rule card, apricot bar)
    <div class="expr ltr">&sigma;<sub>year &ge; 2</sub>(Students)</div>                       (expression chip)
    <pre class="code ltr">SELECT name FROM Students WHERE year &gt;= 2;</pre>
    <table class="d src">...</table>  <table class="d res">...</table>                    (source / result tables)
      rows: <tr class="sel|ok|nt|no">, NULL cell: <td class="null"><span>NULL</span></td>, mark cell: <td class="mk">...</td>
    <span class="ltr">LTR island</span>
  Print gotcha: every responsive breakpoint MUST be "@media screen and", otherwise Chromium prints the mobile layout.
-->
<style>
/*
  Raz Elbaz / RowdyQL - design tokens (generated 2026-10-05 from kit.json)
  Every hex is a literal from kit.json; a derived value says so in a comment.
  Two themes. Light is the default (:root). Dark applies under prefers-color-scheme: dark unless the page sets
  data-theme="light", and always under :root[data-theme="dark"] (the same mapping as source/direction-board.html).
  Google Fonts (fetched 2026-10-05):
  https://fonts.googleapis.com/css2?family=Rubik:wght@800;900&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Math&display=swap
*/

/* ===== Block 1 - brand-studio compatible names (light, default) ===== */
:root{
  /* colors */
  --bg:#F7F2EC;
  --surface:#FDFBF8;
  --ink:#373C44;
  --muted:#5F6670;
  --accent:#20778A;              /* neon, text tier: safe for type (4.64 on bg, 5.00 on surface) */
  --accent-strong:var(--accent); /* not defined in kit.json (no hover or pressed shade); aliased to accent */
  --border:#DDD7CF;
  --success:#276B43;             /* state: correct */
  --warning:#966212;             /* state: note */
  --danger:#B23A2E;              /* state: wrong, delete, forbidden */
  /* typography */
  --font-head:'Rubik','Noto Sans Math',system-ui,sans-serif;
  --font-body:'Heebo','Noto Sans Math',system-ui,sans-serif;
  /* radius: softly rounded (Raz, 2026-10-05): sm chips and inputs, md buttons and cards, lg panels and dialogs; pill for toggles and status pills */
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:14px;
  --radius-pill:999px;
  /* shadow ramp, ONE model: none (flat and matte; glow is a separate data highlight, Block 3) */
  --shadow-1:none;
  --shadow-2:none;
  --shadow-3:none;
  --shadow-4:none;
  /* layout */
  --maxw:1180px;
}

/* ===== Block 2 - identity additions (light, default) ===== */
:root{
  --text:#373C44;
  --depth:var(--ink);            /* not defined in kit.json (shadow model none); aliased to ink */
  --accent-2:#C3401B;            /* coral, text tier */
  --accent-3:#AD551B;            /* apricot, text tier */
  --accent-4:#89682F;            /* sun, text tier */
  --accent-5:#3F7392;            /* sky, text tier */
  --font-mono:'IBM Plex Mono','Noto Sans Math',ui-monospace,monospace;  /* code, data, labels; Latin only */
  --border-w:1px;
  --border-line:var(--border-w) solid var(--border);
  --radius-xl:18px;            /* large frames: the hero panel, covers */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --ease:ease;                   /* not defined in kit.json: the CSS default, as on the board */
  --focus-ring:2px solid var(--neon-l);  /* board line 80; 3.00 on bg, 3.23 on surface */
  --floor-web:18px;
  --floor-slide:26px;
  --floor-caption:14px;
}

/* ===== Block 3 - RowdyQL extensions (kit.json x_ keys, light, default) ===== */
:root{
  --soft:#E7F2F4;                /* cool canvas (bg-cool) */
  /* brand hues: soft (fills, tints, glow) / line (strokes, 3:1) / text (type, 4.5:1) */
  --neon:#5CC3D9;    --neon-l:#2999B1;    --neon-t:#20778A;
  --coral:#FD977A;   --coral-l:#E56541;   --coral-t:#C3401B;
  --apricot:#FAA670; --apricot-l:#DD6D25; --apricot-t:#AD551B;
  --sun:#E6C792;     --sun-l:#AF853C;     --sun-t:#89682F;
  --sky:#8CBDDA;     --sky-l:#5793B7;     --sky-t:#3F7392;
  /* neutrals */
  --grid:#EDE9E4;                /* quiet grid, ink at 5%, always lighter than --border */
  --hatch:#E1E0DF;               /* NULL hatch, ink at 14% */
  --fill:#DBD7D4;                /* ring track, schema-map row stubs */
  --bar:#DDDCDB;                 /* quiet bars */
  /* states: reserved for marking, never decoration */
  --good:#276B43;  --good-s:#DCEFE3;
  --note:#966212;  --note-l:#C07D16; --note-s:#FFF1D6;
  --bad:#B23A2E;   --bad-s:#FBE3E0;
  --neutral:#5F6670; --neutral-s:#ECE8E3;
  --sel-s:#E3F2F3;               /* selected tint = color-mix(in srgb,#5CC3D9 16%,surface); text on it is ink only */
  --result-head:#CDEAEF;         /* derived: color-mix(in srgb,#5CC3D9 30%,surface); ink only */
  --result-line:var(--neon-l);   /* 1px outline around the result table */
  /* gradients */
  --flow:linear-gradient(90deg,#FD977A 0%,#FAA670 28%,#E6C792 50%,#5CC3D9 74%,#8CBDDA 100%);
  --wash-sky:linear-gradient(90deg,#F7F2EC 0%,#E7F2F4 100%);
  --wash-coral:linear-gradient(90deg,#F7F2EC 0%,#F8E0D5 100%);
  --wash-apricot:linear-gradient(90deg,#F7F2EC 0%,#F8E1D1 100%);
  --wash-sun:linear-gradient(90deg,#F7F2EC 0%,#F2E6D3 100%);
  --wash-cool:linear-gradient(90deg,#F7F2EC 0%,#DCEAE8 100%);
  --wash-flow:linear-gradient(90deg,#F8E0D5 0%,#F7F2EC 50%,#E7F2F4 100%);  /* only with a source and a result */
  /* glow: only on data points, active lines, progress; never behind text; off in print */
  --glow-a:.55;
  --glow-point:drop-shadow(0 0 2px rgba(92,195,217,var(--glow-a))) drop-shadow(0 0 7px rgba(92,195,217,calc(var(--glow-a)*.7)));
  --glow-ring:drop-shadow(0 0 3px rgba(92,195,217,calc(var(--glow-a)*.9))) drop-shadow(0 0 10px rgba(250,166,112,calc(var(--glow-a)*.55)));
  /* type */
  --head-weight:800;
  --wordmark-weight:900;
  --lh-head:1.12;
  --lh-body:1.6;
  --floor-mono-label:12px;
  --floor-print:11pt;
  --floor-post-headline:48px;
  /* motif bridge: motifs/*.svg read --rq-* (light hex fallbacks inside each file) */
  --rq-bg:var(--bg); --rq-surface:var(--surface); --rq-ink:var(--ink); --rq-muted:var(--muted);
  --rq-rule:var(--border); --rq-grid:var(--grid); --rq-hatch:var(--hatch); --rq-fill:var(--fill); --rq-bar:var(--bar);
  --rq-neon:var(--neon); --rq-neon-l:var(--neon-l); --rq-neon-t:var(--neon-t);
  --rq-coral:var(--coral); --rq-apricot:var(--apricot); --rq-sun:var(--sun); --rq-sky:var(--sky); --rq-sky-l:var(--sky-l);
  --rq-good:var(--good); --rq-good-s:var(--good-s); --rq-note:var(--note); --rq-note-s:var(--note-s);
  --rq-bad:var(--bad); --rq-bad-s:var(--bad-s);
  --rq-glow-a:var(--glow-a);
  --rq-band-a:.45;               /* schema-map header bands */
  --rq-band-res-a:.5;            /* schema-map result band */
  color-scheme:light;
}

/* ===== Dark theme (same values in both selectors) ===== */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161B; --surface:#182027; --ink:#E6EAEE; --muted:#9AA4AE; --border:#2E3943;
    --accent:#5CC3D9;
    --success:#6BD09A; --warning:#F2B75A; --danger:#F28B7E;
    --text:#E6EAEE;
    --accent-2:#FD977A; --accent-3:#FAA670; --accent-4:#E6C792; --accent-5:#8CBDDA;
    --soft:#0F1A20;
    --neon-l:#5CC3D9; --neon-t:#5CC3D9;
    --coral-l:#FD977A; --coral-t:#FD977A;
    --apricot-l:#FAA670; --apricot-t:#FAA670;
    --sun-l:#E6C792; --sun-t:#E6C792;
    --sky-l:#8CBDDA; --sky-t:#8CBDDA;
    --grid:#1C2126; --hatch:#394047; --fill:#2A333C; --bar:#3D444B;
    --good:#6BD09A; --good-s:#12321F;
    --note:#F2B75A; --note-l:#F2B75A; --note-s:#3A2B0C;
    --bad:#F28B7E; --bad-s:#3D1712;
    --neutral:#9AA4AE; --neutral-s:#232B33;
    --sel-s:#233A43;
    --result-head:#2C515C;         /* derived: color-mix(in srgb,#5CC3D9 30%,#182027) */
    --wash-sky:linear-gradient(90deg,#11161B 0%,#25313A 100%);
    --wash-coral:linear-gradient(90deg,#11161B 0%,#322828 100%);
    --wash-apricot:linear-gradient(90deg,#11161B 0%,#322A27 100%);
    --wash-sun:linear-gradient(90deg,#11161B 0%,#2F2F2C 100%);
    --wash-cool:linear-gradient(90deg,#11161B 0%,#1F2F35 100%);
    --wash-flow:linear-gradient(90deg,#322828 0%,#11161B 50%,#25313A 100%);
    --glow-a:.85;
    --rq-band-a:.35; --rq-band-res-a:.35;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#182027; --ink:#E6EAEE; --muted:#9AA4AE; --border:#2E3943;
  --accent:#5CC3D9;
  --success:#6BD09A; --warning:#F2B75A; --danger:#F28B7E;
  --text:#E6EAEE;
  --accent-2:#FD977A; --accent-3:#FAA670; --accent-4:#E6C792; --accent-5:#8CBDDA;
  --soft:#0F1A20;
  --neon-l:#5CC3D9; --neon-t:#5CC3D9;
  --coral-l:#FD977A; --coral-t:#FD977A;
  --apricot-l:#FAA670; --apricot-t:#FAA670;
  --sun-l:#E6C792; --sun-t:#E6C792;
  --sky-l:#8CBDDA; --sky-t:#8CBDDA;
  --grid:#1C2126; --hatch:#394047; --fill:#2A333C; --bar:#3D444B;
  --good:#6BD09A; --good-s:#12321F;
  --note:#F2B75A; --note-l:#F2B75A; --note-s:#3A2B0C;
  --bad:#F28B7E; --bad-s:#3D1712;
  --neutral:#9AA4AE; --neutral-s:#232B33;
  --sel-s:#233A43;
  --result-head:#2C515C;           /* derived: color-mix(in srgb,#5CC3D9 30%,#182027) */
  --wash-sky:linear-gradient(90deg,#11161B 0%,#25313A 100%);
  --wash-coral:linear-gradient(90deg,#11161B 0%,#322828 100%);
  --wash-apricot:linear-gradient(90deg,#11161B 0%,#322A27 100%);
  --wash-sun:linear-gradient(90deg,#11161B 0%,#2F2F2C 100%);
  --wash-cool:linear-gradient(90deg,#11161B 0%,#1F2F35 100%);
  --wash-flow:linear-gradient(90deg,#322828 0%,#11161B 50%,#25313A 100%);
  --glow-a:.85;
  --rq-band-a:.35; --rq-band-res-a:.35;
  color-scheme:dark;
}

/* Print: glow off. Pages that print also set body{background:#fff}. */
@media print{
  :root{ --glow-point:none; --glow-ring:none; }
}

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html{ font-size:18px; scroll-behavior:smooth; }
  body{ font-family:var(--font-body); font-size:var(--floor-web); line-height:1.7; color:var(--text); background:var(--bg); overflow-x:hidden; }
  :is(a,button,[tabindex]):focus-visible{ outline:var(--focus-ring); outline-offset:2px; }
  a{ color:var(--accent); }
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{ transition:none!important; animation:none!important; scroll-behavior:auto!important; } }
  .ltr{ direction:ltr; unicode-bidi:isolate; }
  svg{ direction:ltr; }

  /* top bar (also the print header) */
  .top{ position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:var(--border-line); padding:12px 24px; display:flex; align-items:center; gap:16px; }
  .top .bk-logo{ height:28px; width:auto; display:block; flex:none; }
  .top__title{ margin-inline-start:auto; font-family:var(--font-body); font-weight:500; font-size:15px; color:var(--muted); }

  /* reading progress */
  .progress{ position:fixed; top:53px; inset-inline-start:0; height:2px; width:var(--p,0%); background:var(--neon-l); z-index:49; }

  /* hero */
  .hero{ max-width:860px; margin:48px auto 24px; padding:0 24px; }
  .hero__kicker{ font:500 13px/1.4 var(--font-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:12px; }
  .hero__title{ font-family:var(--font-head); font-weight:var(--head-weight); font-size:clamp(38px,5.4vw,58px); line-height:var(--lh-head); letter-spacing:-.01em; color:var(--ink); margin:0 0 12px; }
  .hero__deck{ font-size:20px; color:var(--muted); max-width:640px; margin:0; }
  .hero__rule{ height:4px; width:38%; background:var(--flow); margin:24px 0 16px; }
  .hero__meta{ display:flex; gap:16px; flex-wrap:wrap; font-size:14px; color:var(--muted); }

  /* cover */
  .cover{ max-width:860px; margin:0 auto 32px; padding:0 24px; }
  .cover img, .cover svg{ width:100%; height:auto; display:block; }
  .cover img{ aspect-ratio:3/2; object-fit:cover; border:var(--border-line); background:var(--surface); }

  /* article */
  .article{ max-width:760px; margin:0 auto; padding:0 24px 32px; }
  .article p{ margin:0 0 18px; }
  .article p.lead .lead-in{ font-family:var(--font-head); font-weight:var(--head-weight); color:var(--ink); }
  .article h2{ font-family:var(--font-head); font-weight:var(--head-weight); font-size:27px; line-height:var(--lh-head); letter-spacing:-.01em; color:var(--ink); margin:40px 0 12px; padding-top:16px; border-top:var(--border-line); }
  .article h3{ font-family:var(--font-head); font-weight:var(--head-weight); font-size:21px; line-height:1.2; color:var(--ink); margin:28px 0 8px; }
  .article strong{ color:var(--ink); }
  .callout, .quote{ background:var(--surface); border:var(--border-line); border-inline-start:3px solid var(--neon-l); padding:16px 20px; margin:24px 0; }
  .quote{ border-inline-start-color:var(--apricot-l); }
  .callout p, .quote p{ margin:0; }
  .callout__title{ font-family:var(--font-head); font-weight:var(--head-weight); font-size:17px; margin:0 0 4px!important; color:var(--ink); }
  .quote p{ font-family:var(--font-head); font-weight:var(--head-weight); font-size:22px; line-height:1.35; color:var(--ink); }
  .quote cite{ display:block; margin-top:8px; font-style:normal; font-size:14px; color:var(--muted); }
  .expr{ display:inline-block; font:500 18px/1.5 var(--font-mono); background:var(--bg); border:var(--border-line); padding:4px 12px; margin:4px 0 16px; }
  .code{ font:400 15px/1.6 var(--font-mono); background:var(--surface); border:var(--border-line); padding:12px 16px; overflow-x:auto; margin:0 0 18px; text-align:left; }
  table.d{ border-collapse:collapse; width:100%; font:400 15px/1.5 var(--font-mono); background:var(--surface); direction:ltr; margin:0 0 18px; }
  table.d caption{ caption-side:top; text-align:left; font:500 12.6px var(--font-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding-bottom:6px; }
  table.d th, table.d td{ border:1px solid var(--border); padding:4px 8px; text-align:left; }
  table.d.src th{ background:var(--neutral-s); color:var(--ink); font-weight:500; }
  /* result outline on the outer cell edges (the caption stays outside the outline) */
  table.d.res thead th{ border-top-color:var(--result-line); } table.d.res tr > :first-child{ border-left-color:var(--result-line); } table.d.res tr > :last-child{ border-right-color:var(--result-line); } table.d.res tbody tr:last-child td{ border-bottom-color:var(--result-line); }
  table.d.res th{ background:var(--result-head); color:var(--ink); font-weight:500; }
  table.d tr.sel td{ background:var(--sel-s); --cell-bg:var(--sel-s); }
  table.d tr.ok td{ background:var(--good-s); --cell-bg:var(--good-s); }
  table.d tr.nt td{ background:var(--note-s); --cell-bg:var(--note-s); }
  table.d tr.no td{ background:var(--bad-s); --cell-bg:var(--bad-s); }
  table.d tr.no td:not(.mk){ text-decoration:line-through; text-decoration-color:var(--bad); color:var(--muted); }
  table.d td.mk{ width:2.2em; text-align:center; font-weight:500; }
  tr.ok td.mk{ color:var(--good); } tr.nt td.mk{ color:var(--note); } tr.no td.mk{ color:var(--bad); }
  td.null{ background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 6px); color:var(--muted); font-style:italic; }
  td.null > span{ background:var(--cell-bg,var(--surface)); padding:0 .25em; }

  /* divider: the data line */
  .divider{ max-width:760px; margin:0 auto 24px; padding:0 24px; display:flex; justify-content:center; }
  .divider svg{ width:200px; height:auto; }

  /* takeaways */
  .takeaways{ max-width:760px; margin:0 auto 48px; padding:0 24px; }
  .takeaways__panel{ background:var(--surface); border:var(--border-line); padding:24px; }
  .takeaways h2{ margin:0 0 12px; font-family:var(--font-head); font-weight:var(--head-weight); font-size:21px; color:var(--ink); }
  .takeaways ul{ margin:0; padding-inline-start:20px; }
  .takeaways li{ margin:6px 0; }

  /* footer */
  .foot{ border-top:var(--border-line); background:var(--surface); padding:20px 24px; text-align:center; font-size:14px; color:var(--muted); }
  .foot .ltr{ display:inline-block; }

  /* "screen and" is REQUIRED on every breakpoint */
  @media screen and (max-width:720px){
    .top__title{ display:none; }
    .hero{ margin-top:32px; }
    .hero__deck{ font-size:18px; }
    .hero__rule{ width:50%; }
  }

  /* ======== PRINT (A4) ======== */
  @page{ size:A4; margin:8mm 16mm; }
  @media print{
    :root{ color-scheme:light; }
    html{ font-size:11pt; }
    body{ background:#fff; color:#373C44; font-size:11pt; line-height:1.55; }
    .top{ position:static; background:#fff; border:0; padding:0 0 6mm; }
    .top .bk-logo{ height:8mm; }
    .top .bk-logo .w{ fill:#373C44; } .top .bk-logo .nl{ fill:#2999B1; }
    .top__title, .progress, .divider, .no-print{ display:none !important; }
    .hero{ margin:0 0 6mm; padding:0; max-width:none; }
    .hero__title{ font-size:24pt; color:#373C44; }
    .hero__deck{ font-size:12pt; }
    .hero__kicker, .hero__meta, table.d caption{ font-size:9pt; }
    .cover{ padding:0; margin:0 0 6mm; max-width:none; break-inside:avoid; }
    .cover img{ border-width:1px; }
    .article, .takeaways{ padding:0; max-width:none; }
    .article h2{ font-size:16pt; break-after:avoid; }
    .article h3{ font-size:13pt; break-after:avoid; }
    .callout, .quote, .takeaways__panel, table.d, .code, figure{ break-inside:avoid; background:#fff; }
    .quote p{ font-size:14pt; }
    .foot{ background:#fff; font-size:9pt; padding:4mm 0 0; }
    svg *{ filter:none !important; }
    img{ max-width:100%; }
  }
</style>
</head>
<body>

<header class="top">
