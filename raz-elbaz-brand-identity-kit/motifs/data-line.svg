<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="400" height="240" role="img" aria-labelledby="t-data-line d-data-line">
<title id="t-data-line">Data line (קו נתונים)</title>
<desc id="d-data-line">Data line: one quiet line (muted, 1.5) that is easy to follow; only the segment that reaches the result turns neon line tier (2.5), and its end point glows in neon. Source: direction-board.html line 445.</desc>
<!-- RowdyQL motif "data-line", approved 2026-10-04 (Q6), emitted 2026-10-05. Colors are CSS custom properties with the rq- prefix; each fallback is the light-theme hex, and design-tokens.css maps --rq-* to the current theme (inline the SVG to get dark colors; as an img it shows the light fallbacks). The one blue is the neon: soft #5CC3D9, line #2999B1, text #20778A (dark #5CC3D9 for all). Glow is off in print. -->
<style>.rq-glow-neon{filter:drop-shadow(0 0 2px rgba(92,195,217,var(--rq-glow-a,.55))) drop-shadow(0 0 7px rgba(92,195,217,calc(var(--rq-glow-a,.55)*.7)))}.rq-glow-ring{filter:drop-shadow(0 0 3px rgba(92,195,217,calc(var(--rq-glow-a,.55)*.9))) drop-shadow(0 0 10px rgba(92,195,217,calc(var(--rq-glow-a,.55)*.45)))}@media print{.rq-glow-neon,.rq-glow-ring{filter:none}}</style>
<path d="M16 92 H70 V52 H118" fill="none" stroke="#5F6670" stroke-width="1.5" style="stroke:var(--rq-muted,#5F6670)"/>
<rect x="118" y="44" width="16" height="16" fill="#FDFBF8" stroke="#2999B1" stroke-width="1.5" style="fill:var(--rq-surface,#FDFBF8);stroke:var(--rq-neon-l,#2999B1)"/>
<path d="M134 52 H150 V30 H180" fill="none" stroke="#2999B1" stroke-width="2.5" style="stroke:var(--rq-neon-l,#2999B1)"/>
<circle cx="16" cy="92" r="3" fill="#5F6670" style="fill:var(--rq-muted,#5F6670)"/>
<circle cx="70" cy="92" r="2.5" fill="#5F6670" style="fill:var(--rq-muted,#5F6670)"/>
<circle class="rq-glow-neon" cx="180" cy="30" r="5" fill="#5CC3D9" style="fill:var(--rq-neon,#5CC3D9)"/>
</svg>
