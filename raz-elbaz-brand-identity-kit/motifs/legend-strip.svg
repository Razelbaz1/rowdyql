<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="400" height="240" role="img" aria-labelledby="t-legend-strip d-legend-strip">
<title id="t-legend-strip">Legend strip (פס מקרא)</title>
<desc id="d-legend-strip">Legend strip: named color squares (soft tier) under a hairline rule, at the foot of an output; every square carries its name. A legend that keys a compare chart uses the line tier instead. Source: direction-board.html lines 149-151, 168-169, 449.</desc>
