<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="400" height="240" role="img" aria-labelledby="t-progress-ring d-progress-ring">
<title id="t-progress-ring">Progress ring (טבעת התקדמות)</title>
<desc id="d-progress-ring">Progress ring: how much of a chapter is done; the arc is a soft apricot-sun-neon gradient with the ring glow, the rest is fill gray, and the percentage is always printed inside in ink (10.74:1 light). Source: direction-board.html lines 65, 450.</desc>
<!-- RowdyQL motif "progress-ring", approved 2026-10-04 (Q6), emitted 2026-10-05. Colors are CSS custom properties with the rq- prefix; each fallback is the light-theme hex, and design-tokens.css maps --rq-* to the current theme (inline the SVG to get dark colors; as an img it shows the light fallbacks). The one blue is the neon: soft #5CC3D9, line #2999B1, text #20778A (dark #5CC3D9 for all). Glow is off in print. -->
<style>.rq-glow-neon{filter:drop-shadow(0 0 2px rgba(92,195,217,var(--rq-glow-a,.55))) drop-shadow(0 0 7px rgba(92,195,217,calc(var(--rq-glow-a,.55)*.7)))}.rq-glow-ring{filter:drop-shadow(0 0 3px rgba(92,195,217,calc(var(--rq-glow-a,.55)*.9))) drop-shadow(0 0 10px rgba(250,166,112,calc(var(--rq-glow-a,.55)*.55)))}@media print{.rq-glow-neon,.rq-glow-ring{filter:none}}</style>
<defs><linearGradient id="rq-gr1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#FAA670" style="stop-color:var(--rq-apricot,#FAA670)"/><stop offset=".5" stop-color="#E6C792" style="stop-color:var(--rq-sun,#E6C792)"/><stop offset="1" stop-color="#5CC3D9" style="stop-color:var(--rq-neon,#5CC3D9)"/></linearGradient></defs>
<circle cx="100" cy="60" r="36" fill="none" stroke="#DBD7D4" stroke-width="10" style="stroke:var(--rq-fill,#DBD7D4)"/>
<circle class="rq-glow-ring" cx="100" cy="60" r="36" fill="none" stroke="url(#rq-gr1)" stroke-width="10" stroke-linecap="round" stroke-dasharray="158 226" transform="rotate(-90 100 60)"/>
